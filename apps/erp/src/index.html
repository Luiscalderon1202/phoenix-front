         títulos nítidos y las tablas alineadas en pantallas densas. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
